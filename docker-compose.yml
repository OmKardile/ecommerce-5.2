# ==============================================================================
# Patel Networks — Production database stack for the client VPS
# Self-hosted PostgreSQL 16 + PgBouncer connection pooler.
# No managed database services (ADR-022). Supabase fully removed.
# ==============================================================================
#
# Usage on the VPS:
#   1. Create a persistent volume directory: sudo mkdir -p /var/lib/patelnetworks/pgdata
#   2. Copy this file + .env (with real POSTGRES_PASSWORD) to the VPS.
#   3. docker compose up -d
#   4. Create the app role + database:
#        docker compose exec db psql -U postgres -c \
#          "CREATE USER patelnetworks WITH PASSWORD 'CHANGE_ME'; \
#           CREATE DATABASE patelnetworks OWNER patelnetworks; \
#           GRANT ALL PRIVILEGES ON DATABASE patelnetworks TO patelnetworks;"
#   5. Run prisma migrate / db push from the app host using DATABASE_URL in .env.
#
# Backups: see ./scripts/backup-db.sh — pg_dump to /var/lib/patelnetworks/backups
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: patelnetworks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      # Persistent data volume — survives container recreation
      - /var/lib/patelnetworks/pgdata:/var/lib/postgresql/data
    ports:
      # Expose only on localhost — the app connects via the VPS internal network.
      # For remote app hosts, restrict to specific IPs via firewall rules.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: patelnetworks-pgbouncer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: patelnetworks
      DB_PASSWORD: ${PGBOUNCER_APP_PASSWORD:?PGBOUNCER_APP_PASSWORD is required}
      DB_NAME: patelnetworks
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      # Pooled connection — used by DATABASE_URL in the app
      - "127.0.0.1:6432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# NOTE: No named volumes — we bind-mount /var/lib/patelnetworks/pgdata so the
# client owns the data directory directly on the VPS host (backup-ready).
