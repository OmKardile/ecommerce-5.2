# Render Blueprint — Patel Networks
# https://render.com/docs/blueprint-spec
# This file defines the web service + all environment variables.
# Deploy via: connect GitHub repo → Render detects render.yaml → auto-configures.

services:
  - type: web
    name: patel-5.2
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # ── Database (Supabase PostgreSQL — temporary until VPS provisioning) ──
      - key: DATABASE_URL
        value: postgresql://postgres.yhqgogsednnarjfspado:AJ9J8PM4iS2q8D0C@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&pgbouncer=true
      - key: DIRECT_URL
        value: postgresql://postgres.yhqgogsednnarjfspado:AJ9J8PM4iS2q8D0C@aws-0-ap-northeast-1.supabase.com:5432/postgres?sslmode=require

      # ── Authentication ──
      - key: JWT_SECRET
        value: f8Torv3csTSc+GFaIOxzyvu74tpz0vzcSjudKHYpRb9Efburdq0KzeyT0pzulEMo
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production

      # ── Application ──
      - key: NEXT_PUBLIC_APP_URL
        value: https://patel-5-2.onrender.com

      # ── Razorpay (SIMULATION MODE — placeholder keys) ──
